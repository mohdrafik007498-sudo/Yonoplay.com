<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Yonoplay Admin Panel</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  min-height:100vh;
  background:#070b17;
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.login-box{
  width:100%;
  max-width:400px;
  background:#111a33;
  border:1px solid #26345f;
  border-radius:20px;
  padding:35px 25px;
  box-shadow:0 15px 50px rgba(0,0,0,.4);
}

.logo{
  text-align:center;
  font-size:30px;
  font-weight:bold;
  margin-bottom:10px;
  color:#2edcff;
}

.logo span{
  color:#7657ff;
}

h2{
  text-align:center;
  margin-bottom:8px;
}

p{
  text-align:center;
  color:#aab3c8;
  margin-bottom:25px;
}

input{
  width:100%;
  padding:15px;
  margin-bottom:15px;
  border-radius:10px;
  border:1px solid #33436d;
  background:#0a1022;
  color:white;
  font-size:16px;
}

button{
  width:100%;
  padding:15px;
  border:none;
  border-radius:10px;
  font-size:17px;
  font-weight:bold;
  cursor:pointer;
  background:linear-gradient(90deg,#2edcff,#7657ff);
  color:white;
}

button:hover{
  opacity:.9;
}

#error{
  display:none;
  color:#ff6b6b;
  text-align:center;
  margin-top:15px;
}
</style>
</head>

<body>

<div class="login-box">

<div class="logo">Yono<span>play</span></div>

<h2>Admin Login</h2>

<p>Login to manage games</p>

<input
type="email"
id="email"
placeholder="Admin Email"
>

<input
type="password"
id="password"
placeholder="Password"
>

<button onclick="login()">
Login
</button>

<div id="error">
Invalid login details
</div>

</div>

<script>

function login(){

const email =
document.getElementById("email").value;

const password =
document.getElementById("password").value;

if(email === "" || password === ""){

document.getElementById("error")
.style.display="block";

return;

}

/* Supabase login next step */

alert("Login system will be connected with Supabase.");

}

</script>

</body>
</html>
